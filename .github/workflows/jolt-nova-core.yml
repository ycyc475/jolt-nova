name: Jolt-Nova Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  jolt-nova-core:
    name: jolt-core minimal/nova block checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Checkout Nova path dependency
        run: |
          git clone https://github.com/microsoft/Nova.git "$GITHUB_WORKSPACE/../Nova"
          git -C "$GITHUB_WORKSPACE/../Nova" checkout 666e3b25bfb9f8b2106f8b4d8057010f28b1ee79

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --check -p jolt-core -p tracer

      - name: Check jolt-core minimal
        run: cargo check --locked -p jolt-core --lib --no-default-features --features minimal

      - name: Test jolt-core minimal block path
        run: cargo test --locked -p jolt-core --lib --no-default-features --features minimal block

      - name: Test jolt-core Nova block path
        run: cargo test --locked -p jolt-core --lib --no-default-features --features nova block
